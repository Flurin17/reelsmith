name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Install Chrome dependencies for Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 \
            || true
      - run: pnpm reelsmith brand
      # CI=true also runs tests/*.render.test.ts: renders + reviews every example job.
      - run: pnpm test
      - name: Upload review sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review
          path: out/review/**/*.png
          if-no-files-found: ignore
